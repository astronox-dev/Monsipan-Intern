# Stack für Portainer – nimmt das fertige Image aus der GitHub Registry (GHCR).
#
# Portainer → Stacks → Add stack → Repository:
#   Repository URL:      https://github.com/mstreicher98/Monsipan-Intern
#   Compose path:        portainer-stack.yml
#   Environment variables: siehe unten (mindestens ORIGIN setzen)
#
# Das Paket ist öffentlich, Portainer braucht also keine Zugangsdaten. Erst wenn es
# auf privat gestellt wird, in Portainer unter Registries eine GHCR-Registry mit
# GitHub-Benutzer und einem Token (Scope read:packages) anlegen.

services:
  app:
    image: ghcr.io/mstreicher98/monsipan-intern:latest
    restart: unless-stopped
    environment:
      # Pflicht: die öffentliche Adresse hinter dem Cloudflare Tunnel.
      # Ohne passende ORIGIN lehnt SvelteKit alle Formulare ab („Cross-site POST“).
      # Künftig https://portal.monsipan.at – die alte Adresse leitet dann von selbst
      # weiter (README „Umzug auf portal.monsipan.at“).
      ORIGIN: ${ORIGIN:-https://intern.monsipan.at}
      # Echte Besucher-IP hinter dem Tunnel (für die Sperre bei falschen Passwörtern)
      ADDRESS_HEADER: Cf-Connecting-Ip
      TZ: Europe/Vienna
      # Damit sich Sicherungen über die Oberfläche hochladen lassen
      BODY_SIZE_LIMIT: 210M

      # Erster Admin – wird nur beim allerersten Start angelegt.
      # Ohne Passwort erzeugt die App eines und zeigt es einmalig im Log.
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}

      # E-Mail (Passwort vergessen, Einladungen, Warnungen zum Mindestbestand).
      # Ohne SMTP funktioniert alles außer E-Mail.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: '${MAIL_FROM:-Monsipan Portal <lager@monsipan.at>}'

      # Push in der Android-App: am einfachsten den Dienstkonto-Schlüssel aus Firebase
      # in der App unter Verwaltung → Benachrichtigungen hochladen. Alternativ hier
      # (Inhalt, Base64 oder Pfad) – hat dann Vorrang. Siehe README „Benachrichtigungen“.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}

      # Digitale Rechnungssignatur (README „Rechnungen: Ausstellen, Signatur und Archiv“).
      # Passwort für den Schlüssel des eigenen Zertifikats – mindestens 12 Zeichen.
      SIGNATUR_PASSWORT: ${SIGNATUR_PASSWORT:-}
      # Nur für A-Trust bzw. einen anderen Anbieter über die CSC-API
      SIGNATUR_CSC_SECRET: ${SIGNATUR_CSC_SECRET:-}
      SIGNATUR_CSC_PIN: ${SIGNATUR_CSC_PIN:-}
      # Nur für einen Zeitstempeldienst mit Anmeldung
      SIGNATUR_TSA_BENUTZER: ${SIGNATUR_TSA_BENUTZER:-}
      SIGNATUR_TSA_PASSWORT: ${SIGNATUR_TSA_PASSWORT:-}

      # Beispieldaten beim allerersten Start (im Echtbetrieb false lassen)
      DEMO_DATA: ${DEMO_DATA:-false}

    volumes:
      # Datenbank und Sicherungen – hier liegen alle Daten
      - lager-data:/data

    # Variante A (Standard): Port am Server veröffentlichen.
    # Im Cloudflare Tunnel als Service dann http://<Server-IP>:3000 eintragen
    # (läuft cloudflared mit network_mode: host, geht auch http://localhost:3000).
    ports:
      - '3000:3000'

    # Variante B: cloudflared läuft als Container in einem eigenen Docker-Netz.
    # Dann oben die Ports weglassen, hier und unten die Zeilen aktivieren und
    # im Tunnel http://app:3000 eintragen.
    # networks:
    #   - tunnel

# networks:
#   tunnel:
#     external: true
#     name: NAME-DES-BESTEHENDEN-NETZES

volumes:
  lager-data:
