name: Tests und Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruefen:
    name: Typprüfung und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Damit die Tests das verlustfreie Verkleinern mit den echten Werkzeugen prüfen (wie im Image)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qpdf libjpeg-turbo-progs
      - run: npm test

  image:
    name: Image bauen und nach GHCR schieben
    needs: pruefen
    # Bei Pull Requests nur bauen lassen, nicht veröffentlichen
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # GHCR verlangt Kleinbuchstaben im Image-Namen
      - name: Image-Name bestimmen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis
        run: echo "Fertig -> ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
