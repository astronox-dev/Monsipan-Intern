name: Fahrzeug-App (APK)

# Die App „Monsipan Fahrzeug" für die Tablets in den Autos – eigenständig,
# nicht Teil der Portal-App. Fester Download-Link:
# https://github.com/<repo>/releases/download/fahrzeug-app/monsipan-fahrzeug.apk

on:
  push:
    branches: [main]
    paths:
      - 'fahrzeug-app/**'
      - '.github/workflows/fahrzeug-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK bauen und veröffentlichen
    runs-on: ubuntu-latest
    env:
      HAT_SCHLUESSEL: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Derselbe Schlüssel wie bei der Portal-App, falls hinterlegt – sonst Debug-Schlüssel
      - name: Schlüssel bereitstellen
        if: env.HAT_SCHLUESSEL == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lager.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lager.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: fahrzeug-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          APP_URL: ${{ vars.APP_URL || 'https://intern.monsipan.at' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK benennen
        run: cp fahrzeug-app/app/build/outputs/apk/release/app-release*.apk monsipan-fahrzeug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: monsipan-fahrzeug-apk
          path: monsipan-fahrzeug.apk

      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fahrzeug-app
          name: Monsipan Fahrzeug – App für die Tablets
          make_latest: false
          body: |
            App für die Tablets in den Autos (Version 1.0.${{ github.run_number }}).
            Schickt den Standort an das Monsipan Portal – koppeln mit dem Code aus
            Planung → Fahrzeuge.

            Installation am Tablet: Datei öffnen und die Installation aus dieser
            Quelle erlauben. Danach Standort „Immer zulassen" und die
            Akku-Ausnahme bestätigen.
          files: monsipan-fahrzeug.apk
